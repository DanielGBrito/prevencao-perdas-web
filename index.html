<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Prevenção de Perdas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Dashboard - Prevenção de Perdas</h1>

    <section class="mb-5">
      <h2 class="h4">Score de Risco por Loja</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Loja</th>
              <th>Tipo de Perda</th>
              <th>Score de Risco</th>
              <th>Período</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Loja 01</td>
              <td>Quebra</td>
              <td>Alto</td>
              <td>Jan 2025</td>
            </tr>
            <tr>
              <td>Loja 02</td>
              <td>Desvio</td>
              <td>Médio</td>
              <td>Jan 2025</td>
            </tr>
            <tr>
              <td>Loja 03</td>
              <td>Quebra</td>
              <td>Baixo</td>
              <td>Jan 2025</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="h4">Gráfico de Perdas por Tipo</h2>
      <canvas id="graficoPerdas" height="100"></canvas>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById("graficoPerdas").getContext("2d");
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Loja 01", "Loja 02", "Loja 03"],
        datasets: [
          {
            label: "Quebra",
            data: [18, 12, 6],
            backgroundColor: "#dc3545"
          },
          {
            label: "Desvio",
            data: [5, 8, 2],
            backgroundColor: "#ffc107"
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
